name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    if: github.ref_type == 'tag' && github.event.created == true
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: Release
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      tag: ${{ steps.tag.outputs.tag }}
      tag_object: ${{ steps.tag.outputs.tag_object }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify signed tag and successful main-branch CI
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ vars.RELEASE_REPOSITORY }}
          RELEASE_GPG_PUBLIC_KEYS: ${{ vars.RELEASE_GPG_PUBLIC_KEYS }}
        run: bin/check-release-tag

  build:
    needs: verify-tag
    strategy:
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-26.04
          - target: linux-arm64
            runner: ubuntu-26.04-arm
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    # Homebrew may need to build libgit2 and its dependencies from source on Intel.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false

      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27.x'
          cache: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libgit2-dev pkg-config

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install libgit2 pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix libgit2)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Package binary
        env:
          RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
          RELEASE_TAG: ${{ needs.verify-tag.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: bin/package-release "$RELEASE_COMMIT" "$RELEASE_TAG" "$TARGET" "$RUNNER_TEMP/packages"

      - name: Attest the packaged archive
        uses: actions/attest@v4.2.2
        with:
          subject-path: ${{ runner.temp }}/packages/tasks-${{ matrix.target }}.tar.gz

      - name: Upload the attested archive for publication
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ github.run_attempt }}-${{ matrix.target }}
          path: ${{ runner.temp }}/packages/tasks-${{ matrix.target }}.tar.gz
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: [verify-tag, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    steps:
      # Sparse-checkout only the publish script; release assets stay in RUNNER_TEMP.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.verify-tag.outputs.commit }}
          persist-credentials: false
          sparse-checkout: bin/publish-release
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/release-assets

      - name: Verify the complete asset set and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.verify-tag.outputs.commit }}
          TAG_OBJECT: ${{ needs.verify-tag.outputs.tag_object }}
        run: bin/publish-release "$RUNNER_TEMP/release-assets"
