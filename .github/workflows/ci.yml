name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify action lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.5.0
          gh actions-lock --verify

      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27.x'
          cache: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libgit2-dev pkg-config

      - run: bin/test
      - run: bin/vet
      - run: bin/test-release-tag

      - name: Install dprint
        run: |
          npm install --global --prefix "$RUNNER_TEMP/dprint" dprint@0.65.0
          echo "$RUNNER_TEMP/dprint/bin" >> "$GITHUB_PATH"

      - run: bin/check-format
